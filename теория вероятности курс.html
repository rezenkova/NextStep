<script>
    const lectureTexts = {
        lecture1: "КОНСПЕКТ 1: Основные понятия теории вероятностей\n\nТеория вероятностей — раздел математики, изучающий закономерности случайных явлений.\n\nОсновные понятия:\n• Случайное событие — результат, который может произойти или не произойти в данном эксперименте\n• Элементарный исход — простейший, неделимый результат\n• Пространство элементарных исходов (Ω) — множество всех возможных исходов\n\nКлассическое определение вероятности:\nP(A) = m / n, где m — число благоприятных исходов, n — общее число исходов.\n\nПример 1:\nБросаем игральный кубик. Какова вероятность выпадения чётного числа?\nБлагоприятные исходы: {2, 4, 6} — 3 исхода\nВсе исходы: {1, 2, 3, 4, 5, 6} — 6 исходов\nP = 3/6 = 1/2 = 0.5 (50%)\n\nПример 2:\nВ колоде 36 карт. Какова вероятность вытянуть туза?\nТузов в колоде: 4\nP = 4/36 = 1/9 ≈ 0.111",
        
        lecture2: "КОНСПЕКТ 2: Алгебра событий\n\nОперации над событиями:\n• Сумма событий A ∪ B — произошло хотя бы одно из событий\n• Произведение событий A ∩ B — произошли оба события одновременно\n• Противоположное событие Ā — событие, состоящее в том, что A не произошло\n• Разность событий A \\ B — произошло A, но не произошло B\n\nСвойства операций:\n• Коммутативность: A ∪ B = B ∪ A\n• Ассоциативность: (A ∪ B) ∪ C = A ∪ (B ∪ C)\n• Законы де Моргана:\n  (A ∪ B)̄ = Ā ∩ B̄\n  (A ∩ B)̄ = Ā ∪ B̄\n\nНесовместные события — события, которые не могут произойти одновременно: A ∩ B = ∅\n\nПример:\nБросаем кубик.\nA = {выпало чётное число} = {2, 4, 6}\nB = {выпало число > 4} = {5, 6}\nA ∪ B = {2, 4, 5, 6}\nA ∩ B = {6}",
        
        lecture3: "КОНСПЕКТ 3: Теоремы сложения вероятностей\n\nТеорема 1 (для несовместных событий):\nP(A ∪ B) = P(A) + P(B), если A ∩ B = ∅\n\nТеорема 2 (общий случай):\nP(A ∪ B) = P(A) + P(B) − P(A ∩ B)\n\nТеорема 3 (для трёх событий):\nP(A ∪ B ∪ C) = P(A) + P(B) + P(C) − P(A∩B) − P(A∩C) − P(B∩C) + P(A∩B∩C)\n\nПример 1:\nБросаем кубик.\nP(чётное ∪ >4) = P(чёт) + P(>4) − P(чёт ∩ >4)\nP(чёт) = 3/6, P(>4) = 2/6, P(чёт ∩ >4) = P({6}) = 1/6\nP = 3/6 + 2/6 − 1/6 = 4/6 = 2/3\n\nПример 2:\nВероятность противоположного события:\nP(Ā) = 1 − P(A)\nP(НЕ выпало 6) = 1 − 1/6 = 5/6",
        
        lecture4: "КОНСПЕКТ 4: Условная вероятность\n\nУсловная вероятность P(A|B) — вероятность события A при условии, что произошло событие B.\n\nФормула:\nP(A|B) = P(A ∩ B) / P(B), где P(B) > 0\n\nТеорема умножения:\nP(A ∩ B) = P(A) · P(B|A) = P(B) · P(A|B)\n\nНезависимые события:\nСобытия A и B независимы, если P(A ∩ B) = P(A) · P(B)\nИли: P(A|B) = P(A)\n\nПример 1:\nВ урне 3 белых и 2 чёрных шара. Вынимаем 2 шара подряд без возврата.\nP(оба белые) = P(1-й белый) · P(2-й белый | 1-й белый)\nP(1-й белый) = 3/5\nP(2-й белый | 1-й белый) = 2/4 = 1/2\nP = 3/5 · 1/2 = 3/10 = 0.3\n\nПример 2 (независимые):\nБросаем две монеты.\nP(орёл на 1-й И орёл на 2-й) = 1/2 · 1/2 = 1/4",
        
        lecture5: "КОНСПЕКТ 5: Формула полной вероятности и Байеса\n\nФормула полной вероятности:\nЕсли H₁, H₂, ..., Hₙ — полная группа попарно несовместных событий (гипотез), то:\nP(A) = Σ P(Hᵢ) · P(A|Hᵢ)\n\nФормула Байеса:\nP(Hᵢ|A) = P(Hᵢ) · P(A|Hᵢ) / P(A)\nПозволяет пересчитать вероятность гипотезы после получения новой информации.\n\nПример:\nЗавод получает детали от 3 поставщиков:\n• 50% от A (2% брака)\n• 30% от B (3% брака)\n• 20% от C (5% брака)\n\nНайти вероятность, что случайная деталь бракованная:\nP(брак) = 0.5·0.02 + 0.3·0.03 + 0.2·0.05\n= 0.01 + 0.009 + 0.01 = 0.029 (2.9%)\n\nЕсли деталь бракованная, какова вероятность, что она от поставщика A?\nP(A|брак) = 0.5·0.02 / 0.029 ≈ 0.345 (34.5%)",
        
        lecture6: "КОНСПЕКТ 6: Случайные величины\n\nСлучайная величина (СВ) — величина, принимающая в результате опыта одно из возможных числовых значений.\n\nТипы случайных величин:\n• Дискретная СВ — принимает отдельные значения\n• Непрерывная СВ — принимает любые значения из интервала\n\nХарактеристики дискретной СВ:\n• Закон распределения — таблица значений и их вероятностей\n• Σ pᵢ = 1\n\nМатематическое ожидание:\nM(X) = Σ xᵢ · pᵢ\n\nПример:\nБросаем кубик. СВ X — выпавшее число.\nM(X) = 1·1/6 + 2·1/6 + 3·1/6 + 4·1/6 + 5·1/6 + 6·1/6 = 21/6 = 3.5\n\nДисперсия:\nD(X) = M(X²) − [M(X)]²\n\nСреднеквадратичное отклонение:\nσ(X) = √D(X)",
        
        lecture7: "КОНСПЕКТ 7: Распределения вероятностей\n\nБиномиальное распределение:\nОписывает число успехов в n независимых испытаниях с вероятностью успеха p.\nP(X = k) = C(n, k) · p^k · (1-p)^(n-k)\nM(X) = np, D(X) = np(1-p)\n\nПример:\nМонету бросают 10 раз. Вероятность выпадения ровно 6 орлов:\nP(X=6) = C(10,6) · (0.5)^6 · (0.5)^4 = 210 · 0.015625 · 0.0625 ≈ 0.205\n\nНормальное распределение (Гаусса):\nf(x) = (1 / σ√(2π)) · exp(−(x−μ)² / 2σ²)\nПравило трёх сигм: 68-95-99.7\n\nРавномерное распределение на [a, b]:\nf(x) = 1/(b−a), M(X) = (a+b)/2",
        
        lecture8: "КОНСПЕКТ 8: Математическая статистика\n\nСтатистика — наука о сборе, анализе и интерпретации данных.\n\nОсновные понятия:\n• Генеральная совокупность — все объекты\n• Выборка — часть объектов, отобранная для исследования\n\nХарактеристики выборки:\n• Среднее арифметическое: x̄ = Σxᵢ / n\n• Выборочная дисперсия\n• Медиана\n• Мода\n\nДоверительный интервал для среднего (σ известна):\nx̄ ± z · σ/√n\n\nПроверка гипотез:\n• H₀ — нулевая гипотеза\n• H₁ — альтернативная гипотеза\n• p-value — вероятность получить наблюдаемый результат при условии верности H₀\n• Если p-value < α (обычно 0.05) — отвергаем H₀\n\nПример:\nМонету бросили 100 раз, выпало 60 орлов.\nH₀: p = 0.5 (монета честная)\nПри p=0.5 вероятность такого отклонения ≈ 0.028\np-value < 0.05 → вероятно, монета нечестная"
    };

    function saveProgress() {
        const saveData = blocks.map(b => ({
            completed: b.completed, unlocked: b.unlocked,
            tests: b.tests.map(t => ({ userAnswer: t.userAnswer, answered: t.answered })),
            assignments: b.assignments.map(a => ({ submitted: a.submitted, reviewed: a.reviewed, feedback: a.feedback, grade: a.grade, fileName: a.file ? a.file.name : null })),
            videos: b.videos.map(v => ({ watched: v.watched })),
            lectures: b.lectures.map(l => ({ downloaded: l.downloaded }))
        }));
        localStorage.setItem('courseProbTheory_final', JSON.stringify(saveData));
        checkAllBlocksCompleted();
    }

    function checkAllBlocksCompleted() {
        document.getElementById('certificateSection').classList.toggle('visible', blocks.every(b => b.completed));
    }

    function loadProgress() {
        const saved = localStorage.getItem('courseProbTheory_final');
        if (!saved) return;
        try {
            const data = JSON.parse(saved);
            for (let i = 0; i < blocks.length && i < data.length; i++) {
                if (!data[i]) continue;
                blocks[i].completed = data[i].completed || false;
                blocks[i].unlocked = data[i].unlocked || i === 0;
                if (data[i].tests) data[i].tests.forEach((t, j) => { if (t) Object.assign(blocks[i].tests[j], t); });
                if (data[i].assignments) data[i].assignments.forEach((a, j) => { if (a) Object.assign(blocks[i].assignments[j], a); });
                if (data[i].videos) data[i].videos.forEach((v, j) => { if (v) Object.assign(blocks[i].videos[j], v); });
                if (data[i].lectures) data[i].lectures.forEach((l, j) => { if (l) Object.assign(blocks[i].lectures[j], l); });
            }
            for (let i = 1; i < blocks.length; i++) {
                if (blocks[i - 1].completed && !blocks[i].unlocked) blocks[i].unlocked = true;
            }
        } catch (e) { console.warn(e); }
        updateStats();
        loadSubmissionStatuses();
        checkAllBlocksCompleted();
    }

    function loadSubmissionStatuses() {
        const submissions = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
        const currentUser = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
        for (let b of blocks) {
            for (let a of b.assignments) {
                const submission = submissions.find(s =>
                    s.userEmail === currentUser.email &&
                    s.assignmentTitle === a.title &&
                    s.courseName === "Теория вероятностей"
                );
                if (submission) {
                    if (submission.reviewed) { a.reviewed = true; a.submitted = true; a.feedback = submission.feedback || ''; a.grade = submission.grade; }
                    else if (submission.submitted) { a.submitted = true; a.reviewed = false; }
                }
            }
        }
        saveProgress();
    }

    function updateStats() {
        const completed = blocks.filter(b => b.completed).length;
        document.getElementById('totalProgress').innerText = Math.round((completed / blocks.length) * 100);
        document.getElementById('passedBlocks').innerText = completed + '/' + blocks.length;
        let score = 0, cnt = 0;
        blocks.forEach(b => b.tests.forEach(t => { if (t.answered) { cnt++; if (t.userAnswer === t.correct) score++; } }));
        document.getElementById('quizAvg').innerText = cnt ? Math.round((score / cnt) * 100) : 0;
    }

    function checkBlockCompletion(idx) {
        const b = blocks[idx];

            b.tests.every(t => t.answered && t.userAnswer === t.correct) && b.assignments.every(a => a.reviewed);
        if (ok && !b.completed) {
            b.completed = true;
            if (idx + 1 < blocks.length) blocks[idx + 1].unlocked = true;
            saveProgress(); updateStats(); renderBlocksNav();
            if (currentBlock === idx) renderCurrentBlock();
        }
        saveProgress(); updateStats();
    }

                    const fb = document.getElementById(`fb-${qi}`); fb.style.display = 'block';
                    fb.innerHTML = q.userAnswer === q.correct ? '✅ Верно!' : `❌ Правильно: ${q.options[q.correct]}`;
                    fb.style.background = q.userAnswer === q.correct ? '#d1fae5' : '#fee2e2';
                }
            }
        });
        b.assignments.forEach((a, ai) => {
            const ua = c.querySelector(`.upload-area[data-aidx="${ai}"]`);
            if (ua && !a.submitted) ua.onclick = () => {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,.zip,.xlsx,.docx';
                inp.onchange = e => { if (e.target.files[0]) { a.file = e.target.files[0]; saveProgress(); renderCurrentBlock(); } };
                inp.click();
            };
            const sb = c.querySelector(`.submit-assignment[data-aidx="${ai}"]`);
            if (sb) sb.onclick = () => {
                if (!a.file) return alert('Загрузите файл');
                const cu = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
                if (!cu.email) return alert('Войдите в аккаунт');
                const r = new FileReader();
                r.onload = e => {
                    const subs = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
                    const filt = subs.filter(s => !(s.userEmail === cu.email && s.assignmentTitle === a.title && s.courseName === "Теория вероятностей"));
                    filt.push({ id: Date.now(), userEmail: cu.email, studentName: cu.fullName || cu.email, courseName: "Теория вероятностей", blockName: b.name, assignmentTitle: a.title, fileName: a.file.name, fileData: e.target.result, submitted: true, submittedAt: new Date().toISOString(), reviewed: false, grade: null, feedback: null });
                    localStorage.setItem('nextstep_submissions', JSON.stringify(filt));
                    a.submitted = true; a.file = null; saveProgress(); renderCurrentBlock(); alert('✅ Работа отправлена!');
                };
                r.readAsDataURL(a.file);
            };
            const cb = c.querySelector(`.cancel-assignment[data-cidx="${ai}"]`);
            if (cb) cb.onclick = () => {
                const cu = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
                if (a.submitted && !a.reviewed && confirm('Отменить отправку?')) {
                    const subs = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
                    localStorage.setItem('nextstep_submissions', JSON.stringify(subs.filter(s => !(s.userEmail === cu.email && s.assignmentTitle === a.title && s.courseName === "Теория вероятностей"))));
                    a.submitted = false; a.file = null; saveProgress(); renderCurrentBlock();
                } else if (!a.submitted && a.file) { a.file = null; saveProgress(); renderCurrentBlock(); }
            };
        });
        document.getElementById('completeBtn')?.addEventListener('click', () => {
            if (canComplete) {
                b.completed = true;
                if (currentBlock + 1 < blocks.length) blocks[currentBlock + 1].unlocked = true;
                saveProgress(); updateStats(); renderBlocksNav(); renderCurrentBlock();
                alert(`🎉 Блок "${b.name}" пройден!`);
            }
        });
        updateStats();
    }

    loadProgress(); renderBlocksNav(); renderCurrentBlock();
</script>
</body>
</html>
