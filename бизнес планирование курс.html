        .preview-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.35); display: flex; align-items: center; justify-content: center; transition: 0.2s; border-radius: 24px 24px 0 0; }
        .video-card:hover .preview-overlay { background: rgba(68,34,202,0.6); }
        .play-icon-big { width: 60px; height: 60px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #4422CA; font-size: 1.8rem; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: 0.2s; }

        .certificate-btn { background: linear-gradient(135deg, #4422CA, #22B9CA); color: white; border: none; padding: 14px 32px; border-radius: 60px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: all 0.3s ease; box-shadow: 0 8px 25px rgba(68,34,202,0.3); margin: 0 8px; }
        .certificate-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 30px rgba(68,34,202,0.4); }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 40px; max-width: 700px; width: 90%; max-height: 80vh; overflow-y: auto; padding: 28px; position: relative; box-shadow: 0 25px 40px rgba(0,0,0,0.2); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #eef2ff; }
        .modal-header h3 { margin: 0; }

        .close-modal:hover { color: #dc2626; }
        .modal-body { white-space: pre-wrap; line-height: 1.6; color: #334155; font-size: 0.95rem; }

        .back-to-courses {
            display: inline-flex; align-items: center; gap: 10px;
            background: white; backdrop-filter: blur(8px);

            font-size: 0.9rem; text-decoration: none; transition: all 0.3s ease;
            margin-top: 40px; box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }
        .back-to-courses:hover {
            background: linear-gradient(135deg, #4422CA, #22B9CA);

            border-color: transparent; box-shadow: 0 8px 20px rgba(68,34,202,0.25);

        .back-to-courses::before { content: "←"; font-size: 1.2rem; transition: transform 0.2s; }

        @media (max-width: 780px) { .main-content { padding: 24px; } .block-container { padding: 24px; } .blocks-nav { overflow-x: auto; flex-wrap: nowrap; } .video-grid { grid-template-columns: 1fr; } }

<script>
    const lectureTexts = {
        lecture1: "КОНСПЕКТ 1: Что такое бизнес-план\n\nБизнес-план — это документ, описывающий цели бизнеса, стратегию их достижения, рынок, финансовые прогнозы и операционные детали.\n\nЗачем нужен бизнес-план:\n• Привлечение инвестиций и кредитов\n• Оценка жизнеспособности идеи\n• Стратегическое планирование\n• Управление рисками\n\nОсновные разделы бизнес-плана:\n1. Резюме (Executive Summary)\n2. Описание компании\n3. Анализ рынка\n4. Организация и менеджмент\n5. Продукт или услуга\n6. Маркетинг и продажи\n7. Финансовый план\n8. Оценка рисков\n\nОбъём: от 10 до 40 страниц в зависимости от сложности проекта.",
        
        lecture2: "КОНСПЕКТ 2: Анализ рынка\n\nАнализ рынка — основа любого бизнес-плана. Без понимания рынка невозможно построить успешный бизнес.\n\nКомпоненты анализа рынка:\n1. Объём рынка (TAM, SAM, SOM)\n   • TAM — общий объём рынка\n   • SAM — доступный объём рынка\n   • SOM — реально достижимый объём\n\n2. Сегментация клиентов:\n   • Демография (возраст, пол, доход)\n   • География\n   • Поведенческие факторы\n\n3. Анализ конкурентов:\n   • Прямые конкуренты\n   • Косвенные конкуренты\n   • SWOT-анализ (сильные/слабые стороны, возможности/угрозы)\n\nМетоды исследования:\n• Опросы и интервью\n• Анализ открытых данных\n• Mystery shopping",
        
        lecture3: "КОНСПЕКТ 3: Маркетинговая стратегия\n\nМаркетинг-микс (4P):\n• Product — продукт\n• Price — цена\n• Place — место/каналы сбыта\n• Promotion — продвижение\n\nЦенообразование:\n• Затратный метод: цена = себестоимость + наценка\n• Конкурентный метод: ориентация на рынок\n• Ценностный метод: цена исходит из ценности для клиента\n\nКаналы продвижения:\n• SEO и контекстная реклама\n• Социальные сети (SMM)\n• Email-маркетинг\n• Партнёрские программы\n• Офлайн-реклама\n\nВоронка продаж:\nОсведомлённость → Интерес → Желание → Действие → Лояльность\n\nKPI маркетинга:\n• CAC — стоимость привлечения клиента\n• LTV — пожизненная ценность клиента\n• Конверсия\n• ROMI — возврат на маркетинговые инвестиции",
        
        lecture4: "КОНСПЕКТ 4: Операционный план\n\nОперационный план описывает, как именно будет работать бизнес.\n\nКлючевые элементы:\n1. Бизнес-процессы:\n   • Производство/закупки\n   • Логистика\n   • Обслуживание клиентов\n\n2. Необходимые ресурсы:\n   • Оборудование\n   • Помещение\n   • Персонал\n   • Технологии\n\n3. Поставщики и партнёры:\n   • Критерии выбора\n   • Условия сотрудничества\n   • Резервные варианты\n\n4. План запуска (Roadmap):\n   • Подготовительный этап (1-3 месяца)\n   • Запуск MVP\n   • Масштабирование\n\n5. Юридические аспекты:\n   • Форма собственности (ИП, ООО)\n   • Лицензии и разрешения\n   • Интеллектуальная собственность",
        
        lecture5: "КОНСПЕКТ 5: Финансовый план\n\nФинансовый план показывает, сколько денег нужно и когда бизнес станет прибыльным.\n\nОсновные финансовые документы:\n1. Отчёт о прибылях и убытках (P&L)\n   • Выручка\n   • Себестоимость\n   • Валовая прибыль\n   • Операционные расходы\n   • Чистая прибыль\n\n2. Отчёт о движении денежных средств (Cash Flow)\n   • Операционный поток\n   • Инвестиционный поток\n   • Финансовый поток\n\n3. Баланс (Balance Sheet)\n   • Активы\n   • Обязательства\n   • Собственный капитал\n\nКлючевые метрики:\n• Точка безубыточности\n• Срок окупаемости (Payback Period)\n• ROI — возврат на инвестиции\n• NPV — чистая приведённая стоимость\n• IRR — внутренняя норма доходности",
        
        lecture6: "КОНСПЕКТ 6: Оценка рисков\n\nУправление рисками — важнейшая часть бизнес-плана.\n\nТипы рисков:\n1. Рыночные риски:\n   • Изменение спроса\n   • Действия конкурентов\n   • Изменение трендов\n\n2. Финансовые риски:\n   • Кассовые разрывы\n   • Валютные колебания\n   • Рост стоимости заёмного капитала\n\n3. Операционные риски:\n   • Сбои в цепочке поставок\n   • Поломка оборудования\n   • Уход ключевых сотрудников\n\n4. Правовые риски:\n   • Изменение законодательства\n   • Судебные иски\n\nМатрица рисков:\n• Вероятность × Последствия\n• План минимизации для каждого риска\n\nСтратегии управления рисками:\n• Избежание (отказ от рискованной деятельности)\n• Снижение (превентивные меры)\n• Передача (страхование)\n• Принятие (резервный фонд)",
        
        lecture7: "КОНСПЕКТ 7: Презентация бизнес-плана\n\nПрезентация — это ваш шанс «продать» идею инвестору за 10-15 минут.\n\nСтруктура питч-дека:\n1. Проблема (1-2 слайда)\n2. Решение (1-2 слайда)\n3. Рынок (1 слайд)\n4. Бизнес-модель (1 слайд)\n5. Конкуренты (1 слайд)\n6. Команда (1 слайд)\n7. Финансовые показатели (2-3 слайда)\n8. Инвестиционное предложение (1 слайд)\n\nПравила успешной презентации:\n• Не более 15 слайдов\n• Минимум текста, максимум цифр и графики\n• Расскажите историю, а не сухие факты\n• Будьте готовы к вопросам\n• Подготовьте раздаточный материал\n\nТипичные ошибки:\n• Слишком много технических деталей\n• Завышенные прогнозы\n• Игнорирование конкурентов\n• Размытое ценностное предложение",
        
        lecture8: "КОНСПЕКТ 8: Привлечение инвестиций\n\nИсточники финансирования:\n1. Собственные средства (bootstrapping)\n2. Друзья и семья (FFF — Friends, Family, Fools)\n3. Банковские кредиты\n4. Гранты и субсидии\n5. Бизнес-ангелы\n6. Венчурные фонды (VC)\n7. Краудфандинг\n\nСтадии инвестирования:\n• Pre-seed — идея, команда\n• Seed — MVP, первые клиенты\n• Раунд A — масштабирование\n• Раунд B+ — экспансия\n\nОценка компании:\n• Метод дисконтированных денежных потоков (DCF)\n• Мультипликаторы (EV/EBITDA, P/E)\n• Метод сравнимых компаний\n\nTerm Sheet:\n• Размер инвестиций\n• Доля инвестора\n• Условия (ликвидация, защита от размытия)\n• Права (veto, место в совете директоров)"
    };

    function saveProgress() {
        const saveData = blocks.map(b => ({
            completed: b.completed, unlocked: b.unlocked,
            tests: b.tests.map(t => ({ userAnswer: t.userAnswer, answered: t.answered })),
            assignments: b.assignments.map(a => ({ submitted: a.submitted, reviewed: a.reviewed, feedback: a.feedback, grade: a.grade, fileName: a.file ? a.file.name : null })),
            videos: b.videos.map(v => ({ watched: v.watched })),
            lectures: b.lectures.map(l => ({ downloaded: l.downloaded }))
        }));
        localStorage.setItem('courseBusiness_final', JSON.stringify(saveData));
        checkAllBlocksCompleted();
    }

    function checkAllBlocksCompleted() {
        document.getElementById('certificateSection').classList.toggle('visible', blocks.every(b => b.completed));
    }

    function loadProgress() {
    // ========== ПРОВЕРКА АВТОРИЗАЦИИ (с повторной проверкой) ==========
    let currentUser = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
    
    function doRedirect() {
        window.location.href = 'вход некст.html';
    }
    
    if (!currentUser.email || currentUser.role !== 'student') {
        setTimeout(() => {
            let user2 = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
            if (!user2.email || user2.role !== 'student') {
                doRedirect();
            }
        }, 20);
        return;
    }
    // ========== КОНЕЦ ПРОВЕРКИ ==========
    
    const saved = localStorage.getItem('courseBusiness_final');
    if(!saved) return;
    try {
        const data = JSON.parse(saved);
        for(let i=0; i<blocks.length && i<data.length; i++) {
            if(data[i]) {
                blocks[i].completed = data[i].completed || false;
                blocks[i].unlocked = data[i].unlocked || (i===0);
                if(data[i].tests) {
                    for(let t=0; t<blocks[i].tests.length; t++) {
                        if(data[i].tests[t]) {
                            blocks[i].tests[t].userAnswer = data[i].tests[t].userAnswer;
                            blocks[i].tests[t].answered = data[i].tests[t].answered;
                        }
                    }
                }
                if(data[i].assignments) {
                    for(let a=0; a<blocks[i].assignments.length; a++) {
                        if(data[i].assignments[a]) {
                            blocks[i].assignments[a].submitted = data[i].assignments[a].submitted || false;
                            blocks[i].assignments[a].reviewed = data[i].assignments[a].reviewed || false;
                            blocks[i].assignments[a].feedback = data[i].assignments[a].feedback || '';
                            blocks[i].assignments[a].grade = data[i].assignments[a].grade || null;
                        }
                    }
                }
                if(data[i].videos) {
                    for(let v=0; v<blocks[i].videos.length; v++) {
                        if(data[i].videos[v]) blocks[i].videos[v].watched = data[i].videos[v].watched || false;
                    }
                }
                if(data[i].lectures) {
                    for(let l=0; l<blocks[i].lectures.length; l++) {
                        if(data[i].lectures[l]) blocks[i].lectures[l].downloaded = data[i].lectures[l].downloaded || false;
                    }
                }
            }
        }
        for(let i=1; i<blocks.length; i++) {
            if(blocks[i-1].completed && !blocks[i].unlocked) blocks[i].unlocked = true;
        }
    } catch(e) { console.warn(e); }
    updateStats();
    loadSubmissionStatuses();
    checkAllBlocksCompleted();
}

    function loadSubmissionStatuses() {
        const submissions = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
        const currentUser = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
        for (let b of blocks) {
            for (let a of b.assignments) {
                const submission = submissions.find(s =>
                    s.userEmail === currentUser.email &&
                    s.assignmentTitle === a.title &&
                    s.courseName === "Бизнес-планирование"
                );
                if (submission) {
                    if (submission.reviewed) { a.reviewed = true; a.submitted = true; a.feedback = submission.feedback || ''; a.grade = submission.grade; }
                    else if (submission.submitted) { a.submitted = true; a.reviewed = false; }
                }
            }
        }
        saveProgress();
    }

    function updateStats() {
        const completed = blocks.filter(b => b.completed).length;
        document.getElementById('totalProgress').innerText = Math.round((completed / blocks.length) * 100);
        document.getElementById('passedBlocks').innerText = completed + '/' + blocks.length;
        let score = 0, cnt = 0;
        blocks.forEach(b => b.tests.forEach(t => { if (t.answered) { cnt++; if (t.userAnswer === t.correct) score++; } }));
        document.getElementById('quizAvg').innerText = cnt ? Math.round((score / cnt) * 100) : 0;
    }

    function checkBlockCompletion(idx) {
        const b = blocks[idx];
        const ok = b.videos.every(v => v.watched) && b.lectures.every(l => l.downloaded) &&
            b.tests.every(t => t.answered && t.userAnswer === t.correct) && b.assignments.every(a => a.reviewed);
        if (ok && !b.completed) {
            b.completed = true;
            if (idx + 1 < blocks.length) blocks[idx + 1].unlocked = true;
            saveProgress(); updateStats(); renderBlocksNav();
            if (currentBlock === idx) renderCurrentBlock();
        }
        saveProgress(); updateStats();
    }

    function renderBlocksNav() {
        document.getElementById('blocksNav').innerHTML = blocks.map((b, i) => {
            let cls = 'block-tab';
            if (i === currentBlock) cls += ' active';
            if (b.completed) cls += ' completed';
            else if (!b.unlocked && i) cls += ' locked';
            return `<button class="${cls}" data-idx="${i}" ${!b.unlocked && i ? 'disabled' : ''}>${b.name} ${b.completed ? '✓' : ''}</button>`;
        }).join('');
        document.querySelectorAll('.block-tab:not([disabled])').forEach(btn => btn.onclick = () => {
            currentBlock = +btn.dataset.idx; renderCurrentBlock(); renderBlocksNav();
        });
    }

        const canComplete = b.videos.every(v => v.watched) && b.lectures.every(l => l.downloaded) && b.tests.every(t => t.answered && t.userAnswer === t.correct) && b.assignments.every(a => a.reviewed);

        c.innerHTML = `<div class="block-container"><div class="block-title">${b.name}</div><div class="block-subtitle">✅ Видео | ✅ Конспекты | ✅ Тесты | ✅ Проектные задания</div>${vids?'<h3>🎥 Видеоуроки</h3>'+vids:''}${lecs?'<h3>📚 Конспекты</h3>'+lecs:''}<h3>📝 Тесты</h3>${tests}<h3>📂 Проектные задания</h3>${assignments}<button class="complete-block-btn" id="completeBtn" ${b.completed||!canComplete?'disabled':''}>${b.completed?'✅ Блок пройден':'🎉 Завершить блок'}</button></div>`;

        c.querySelectorAll('.video-card').forEach(card => card.onclick = () => {
            const i = +card.dataset.vidx; window.open(b.videos[i].url, '_blank');
            if (!b.videos[i].watched) { b.videos[i].watched = true; checkBlockCompletion(currentBlock); renderCurrentBlock(); }
        });
        c.querySelectorAll('.lecture-item').forEach(lec => lec.onclick = () => {
            const i = +lec.dataset.lidx; showModal(b.lectures[i].title, getLectureContent(currentBlock, i));
            if (!b.lectures[i].downloaded) { b.lectures[i].downloaded = true; checkBlockCompletion(currentBlock); renderCurrentBlock(); }
        });
        b.tests.forEach((q, qi) => {
            const card = c.querySelector(`.quiz-card[data-qidx="${qi}"]`);
            if (!card) return;
            card.querySelectorAll('.quiz-option').forEach(o => o.onclick = () => {
                q.userAnswer = +o.dataset.opt; q.answered = false;
                card.querySelectorAll('.quiz-option').forEach(x => x.classList.remove('selected'));
                o.classList.add('selected');
            });
            card.querySelector('.quiz-submit').onclick = () => {
                if (q.userAnswer == null) return alert('Выберите ответ');
                q.answered = true;
                const fb = document.getElementById(`fb-${qi}`); fb.style.display = 'block';
                fb.innerHTML = q.userAnswer === q.correct ? '✅ Верно!' : `❌ Правильно: ${q.options[q.correct]}`;
                fb.style.background = q.userAnswer === q.correct ? '#d1fae5' : '#fee2e2';
                saveProgress(); checkBlockCompletion(currentBlock); renderCurrentBlock();
            };
            card.querySelector('.quiz-cancel').onclick = () => { q.userAnswer = null; q.answered = false; saveProgress(); renderCurrentBlock(); };
            if (q.userAnswer != null) {
                card.querySelector(`.quiz-option[data-opt="${q.userAnswer}"]`)?.classList.add('selected');
                if (q.answered) {
                    const fb = document.getElementById(`fb-${qi}`); fb.style.display = 'block';
                    fb.innerHTML = q.userAnswer === q.correct ? '✅ Верно!' : `❌ Правильно: ${q.options[q.correct]}`;
                    fb.style.background = q.userAnswer === q.correct ? '#d1fae5' : '#fee2e2';
                }
            }
        });
        b.assignments.forEach((a, ai) => {
            const ua = c.querySelector(`.upload-area[data-aidx="${ai}"]`);
            if (ua && !a.submitted) ua.onclick = () => {
                const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,.zip,.xlsx,.docx,.pptx';
                inp.onchange = e => { if (e.target.files[0]) { a.file = e.target.files[0]; saveProgress(); renderCurrentBlock(); } };
                inp.click();
            };
            const sb = c.querySelector(`.submit-assignment[data-aidx="${ai}"]`);
            if (sb) sb.onclick = () => {
                if (!a.file) return alert('Загрузите файл');
                const cu = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
                if (!cu.email) return alert('Войдите в аккаунт');
                const r = new FileReader();
                r.onload = e => {
                    const subs = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
                    const filt = subs.filter(s => !(s.userEmail === cu.email && s.assignmentTitle === a.title && s.courseName === "Бизнес-планирование"));
                    filt.push({ id: Date.now(), userEmail: cu.email, studentName: cu.fullName || cu.email, courseName: "Бизнес-планирование", blockName: b.name, assignmentTitle: a.title, fileName: a.file.name, fileData: e.target.result, submitted: true, submittedAt: new Date().toISOString(), reviewed: false, grade: null, feedback: null });
                    localStorage.setItem('nextstep_submissions', JSON.stringify(filt));
                    a.submitted = true; a.file = null; saveProgress(); renderCurrentBlock(); alert('✅ Работа отправлена!');
                };
                r.readAsDataURL(a.file);
            };
            const cb = c.querySelector(`.cancel-assignment[data-cidx="${ai}"]`);
            if (cb) cb.onclick = () => {
                const cu = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
                if (a.submitted && !a.reviewed && confirm('Отменить отправку?')) {
                    const subs = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
                    localStorage.setItem('nextstep_submissions', JSON.stringify(subs.filter(s => !(s.userEmail === cu.email && s.assignmentTitle === a.title && s.courseName === "Бизнес-планирование"))));
                    a.submitted = false; a.file = null; saveProgress(); renderCurrentBlock();
                } else if (!a.submitted && a.file) { a.file = null; saveProgress(); renderCurrentBlock(); }
            };
        });
        document.getElementById('completeBtn')?.addEventListener('click', () => {
            if (canComplete) {
                b.completed = true;
                if (currentBlock + 1 < blocks.length) blocks[currentBlock + 1].unlocked = true;
                saveProgress(); updateStats(); renderBlocksNav(); renderCurrentBlock();
                alert(`🎉 Блок "${b.name}" пройден!`);
            }
        });
        updateStats();
    }

    loadProgress(); renderBlocksNav(); renderCurrentBlock();
</script>
</body>
</html>
