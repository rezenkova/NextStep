        .cert-btn.primary:hover { transform: translateY(-3px); box-shadow: 0 14px 35px rgba(68,34,202,0.4); }

        .cert-btn.outline:hover { border-color: #4422CA; color: #4422CA; transform: translateY(-3px); }
        
        .locked-certificate { background: rgba(255,255,255,0.6); border-radius: 32px; padding: 36px; border: 1px solid rgba(68,34,202,0.08); text-align: center; }
        .locked-certificate .lock-icon { font-size: 3rem; margin-bottom: 12px; }

        .locked-certificate p { color: #64748b; font-size: 0.9rem; margin-bottom: 16px; }

        .locked-certificate .btn-back:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(68,34,202,0.35); }

        .assistant-btn:hover { transform: scale(1.05); box-shadow: 0 12px 30px rgba(68,34,202,0.4); }

        .chat-header { padding: 16px 20px; background: linear-gradient(135deg, #4422CA, #22B9CA); color: white; display: flex; justify-content: space-between; align-items: center; }

        .quick-buttons { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px; border-top: 1px solid #e2e8f0; background: white; }

<script>
    // ========== ФУНКЦИИ ДЛЯ РАБОТЫ С РОЛЯМИ ==========
    function getCurrentUser() {
        return JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
    }

    function updateProjectsMenuItem() {
        const user = getCurrentUser();
        const projectsItem = document.getElementById('projectsNavItem');
        const projectsIcon = document.getElementById('projectsIcon');
        const projectsText = document.getElementById('projectsText');
        
        if (user.role === 'teacher') {
            if (projectsIcon) projectsIcon.innerHTML = '📓';
            if (projectsText) projectsText.innerHTML = 'Дневник';
            if (projectsItem) projectsItem.dataset.page = 'diary';
        } else {
            if (projectsIcon) projectsIcon.innerHTML = '📁';
            if (projectsText) projectsText.innerHTML = 'Проекты';
            if (projectsItem) projectsItem.dataset.page = 'projects';
        }
    }

    function navigateTo(page) {
        const pages = {
            'main': 'главная некст.html',
            'catalog': 'каталог некст.html',
            'mycourses': 'мои курсы некст.html',
            'projects': 'мои проекты.html',
            'diary': 'дневник преподавателя.html',
            'certificates': 'сертификаты.html'
        };
        if (pages[page]) {
            window.location.href = pages[page];
        } else {
            showPopup('Страница временно недоступна');
        }
    }

    function showPopup(message, title = "Информация") {
        const overlay = document.getElementById('popupOverlay');
        document.getElementById('popupTitle').innerText = title;
        document.getElementById('popupMessage').innerHTML = message;
        overlay.style.display = 'flex';
    }
    function closePopup() {
        document.getElementById('popupOverlay').style.display = 'none';
    }
    document.getElementById('popupOverlay').addEventListener('click', function(e) {
        if (e.target === this) closePopup();
    });

    function openProfileByRole() {
        const user = getCurrentUser();
        if (user.role === 'teacher') {
            window.location.href = 'панель преподавателя.html';
        } else if (user.role === 'student') {
            window.location.href = 'панель студента.html';
        } else {
            showPopup('Пожалуйста, войдите в аккаунт', 'Вход');
            setTimeout(() => {
                window.location.href = 'вход некст.html';
            }, 1500);
        }
    }

    document.querySelectorAll('.nav-item').forEach(item => {
        item.addEventListener('click', (e) => {
            const page = item.dataset.page;
            if (page === 'certificates') return;
            navigateTo(page);
        });
    });

    document.getElementById('logoHome').addEventListener('click', () => {
        window.location.href = 'главная некст.html';
    });

    document.getElementById('profileBtn').addEventListener('click', openProfileByRole);
    document.getElementById('chatTopBtn').addEventListener('click', () => {
        document.getElementById('chatModal').style.display = 'flex';
    });

    // ========== ЧАТ АССИСТЕНТ ==========
    const chatModalEl = document.getElementById('chatModal');
    const chatMessagesDiv = document.getElementById('chatMessages');
    const chatInputField = document.getElementById('chatInput');

    function addMessage(text, isUser) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
        msgDiv.textContent = text;
        chatMessagesDiv.appendChild(msgDiv);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }

    function showTyping() {
        const td = document.createElement('div');
        td.className = 'typing-indicator';
        td.id = 'typingInd';
        td.innerHTML = '<span></span><span></span><span></span>';
        chatMessagesDiv.appendChild(td);
        chatMessagesDiv.scrollTop = chatMessagesDiv.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typingInd');
        if (el) el.remove();
    }

    function getCertificatesAssistantAnswer(message) {
        const msg = message.toLowerCase().trim();
        if (msg.match(/привет|здравствуй/)) {
            return "🌟 Привет! Я твой помощник по сертификатам. Расскажу, как получить сертификат, где его найти и зачем он нужен. Чем могу помочь?";
        }
        if (msg.match(/получить сертификат|как получить|как получить сертификат/)) {
            return "🏅 Чтобы получить сертификат, нужно полностью завершить все модули курса. После этого сертификат появится на этой странице. Его можно скачать в формате HTML и распечатать!";
        }
        if (msg.match(/где мои сертификаты|где сертификаты|найти сертификаты/)) {
            return "📜 Все ваши полученные сертификаты отображаются на этой странице. Если вы завершили курс, но не видите сертификат — обновите страницу. Сертификаты появляются автоматически!";
        }
        if (msg.match(/какие курсы дают сертификат|за какие курсы|какие курсы/)) {
            return "📚 Сертификаты выдаются за все курсы на платформе: 3D-моделирование, Высшая математика, Философия, HTML-вёрстка, Бизнес-планирование, Теория вероятностей, Оптимизация приложений, Культура речи, Безопасность IT. Завершите любой — получите сертификат!";
        }
        if (msg.match(/зачем нужен сертификат|для чего сертификат|польза/)) {
            return "💡 Сертификат NextStep — это официальное подтверждение ваших знаний. Он помогает при трудоустройстве, поступлении на стажировки и формировании профессионального портфолио. Делитесь им в соцсетях и добавляйте в резюме!";
        }
        if (msg.match(/помощь|что умеешь/)) {
            return "❓ Я могу:\n• Рассказать, как получить сертификат\n• Показать, где найти ваши сертификаты\n• Перечислить курсы с сертификацией\n• Объяснить, зачем нужен сертификат";
        }
        return "🤔 Я могу помочь с сертификатами. Спросите: «как получить сертификат», «где мои сертификаты», «какие курсы дают сертификат» или «зачем нужен сертификат».";
    }

    function handleChat() {
        const msg = chatInputField.value.trim();
        if (!msg) return;
        addMessage(msg, true);
        chatInputField.value = '';
        showTyping();
        setTimeout(() => {
            hideTyping();
            const ans = getCertificatesAssistantAnswer(msg);
            addMessage(ans, false);
        }, 500);
    }

    document.getElementById('sendBtn').onclick = handleChat;
    chatInputField.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleChat(); });

    document.querySelectorAll('.quick-btn').forEach(btn => {
        btn.onclick = () => {
            const q = btn.innerText;
            addMessage(q, true);
            showTyping();
            setTimeout(() => {
                hideTyping();
                let ans = '';
                if (q.includes('получить сертификат')) ans = getCertificatesAssistantAnswer('как получить сертификат');
                else if (q.includes('Где мои сертификаты')) ans = getCertificatesAssistantAnswer('где мои сертификаты');
                else if (q.includes('Какие курсы')) ans = getCertificatesAssistantAnswer('какие курсы дают сертификат');
                else if (q.includes('Зачем нужен')) ans = getCertificatesAssistantAnswer('зачем нужен сертификат');
                else if (q.includes('Помощь')) ans = getCertificatesAssistantAnswer('помощь');
                else ans = getCertificatesAssistantAnswer(q);
                addMessage(ans, false);
            }, 400);
        };
    });

    document.getElementById('assistantBtn').onclick = () => chatModalEl.style.display = 'flex';
    document.getElementById('closeChatBtn').onclick = () => chatModalEl.style.display = 'none';

    // ========== ВСЕ КУРСЫ ДЛЯ СЕРТИФИКАТОВ ==========
    const allCourses = [
        {
            id: '3d-modeling',
            name: '3D-моделирование',
            icon: '🎨',
            storageKey: 'course3d_final',
            teacherName: 'Розалия Ахтямова',
            coursePage: '3д моделирование курс.html',
            description: 'Blender • 8 недель • от новичка до профи'
        },
        {
            id: 'higher-math',
            name: 'Высшая математика',
            icon: '📐',
            storageKey: 'courseMath_final',
            teacherName: 'Елизавета Лытаева',
            coursePage: 'высшая математика курс.html',
            description: 'Матанализ • Линейная алгебра • 6 недель'
        },
        {
            id: 'philosophy',
            name: 'Основы философии',
            icon: '📖',
            storageKey: 'coursePhilo_final',
            teacherName: 'Никита Орлов',
            coursePage: 'основы философии.html',
            description: 'Античность • Средневековье • 5 недель'
        },
        {
            id: 'html-layout',
            name: 'HTML-вёрстка',
            icon: '💻',
            storageKey: 'courseHtml_final',
            teacherName: 'Анна Смирнова',
            coursePage: 'верстка курс.html',
            description: 'HTML5 • CSS3 • Flexbox • Grid • 7 недель'
        },
        {
            id: 'business-planning',
            name: 'Бизнес-планирование',
            icon: '📊',
            storageKey: 'courseBusiness_final',
            teacherName: 'Дмитрий Волков',
            coursePage: 'бизнес планирование курс.html',
            description: 'Стратегия • Финансы • 6 недель'
        },
        {
            id: 'probability-theory',
            name: 'Теория вероятностей',
            icon: '🎲',
            storageKey: 'courseProbTheory_final',
            teacherName: 'Елизавета Лытаева',
            coursePage: 'теория вероятности курс.html',
            description: 'Случайные события • Статистика • 5 недель'
        },
        {
            id: 'optimization',
            name: 'Оптимизация приложений',
            icon: '⚡',
            storageKey: 'courseOptimization_final',
            teacherName: 'Анна Смирнова',
            coursePage: 'оптимизация курс.html',
            description: 'Производительность • Кэширование • 8 недель'
        },
        {
            id: 'speech-culture',
            name: 'Культура речи',
            icon: '🗣️',
            storageKey: 'courseSpeech_final',
            teacherName: 'Никита Орлов',
            coursePage: 'культура курс.html',
            description: 'Риторика • Орфоэпия • 4 недели'
        },
        {
            id: 'it-security',
            name: 'Безопасность IT',
            icon: '🔐',
            storageKey: 'courseSecurity_final',
            teacherName: 'Дмитрий Волков',
            coursePage: 'безопасность курс.html',
            description: 'Кибербезопасность • Шифрование • 7 недель'
        }
    ];

    function isCourseCompleted(storageKey) {
        try {
            const data = JSON.parse(localStorage.getItem(storageKey) || '[]');
            if (Array.isArray(data) && data.length > 0) {
                return data.every(block => block.completed === true);
            }
        } catch(e) {}
        return false;
    }

    function getCompletionDate(storageKey) {
        const dates = JSON.parse(localStorage.getItem('certificate_dates') || '{}');
        if (!dates[storageKey] && isCourseCompleted(storageKey)) {
            dates[storageKey] = new Date().toLocaleDateString('ru-RU', {
                day: 'numeric', month: 'long', year: 'numeric'
            });
            localStorage.setItem('certificate_dates', JSON.stringify(dates));
        }
        return dates[storageKey] || null;
    }

    function downloadCertificateHTML(course, studentName, completionDate) {
        const html = `<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Сертификат - ${course.name}</title>
<style>
    body { font-family: 'Inter', 'Georgia', serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f3ff; margin: 0; padding: 40px; }
    .cert { max-width: 750px; width: 100%; padding: 55px 50px 45px; background: linear-gradient(160deg, #fefdf7, #fdf9ed, #fefce8, #fdf9ed); border: 5px solid #d4a843; border-radius: 20px; text-align: center; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
    .cert::before { content: ''; position: absolute; top: 16px; left: 16px; right: 16px; bottom: 16px; border: 2px solid rgba(212,168,67,0.35); border-radius: 12px; pointer-events: none; }
    .cert::after { content: ''; position: absolute; top: 22px; left: 22px; right: 22px; bottom: 22px; border: 1px solid rgba(212,168,67,0.18); border-radius: 8px; pointer-events: none; }
    .badge { width: 80px; height: 80px; background: linear-gradient(135deg, #4422CA, #22B9CA); border-radius: 50%; margin: 0 auto 20px; font-size: 2.5rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 25px rgba(68,34,202,0.25); position: relative; z-index: 1; }
    h1 { font-size: 2.2rem; color: #1e1b4b; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; position: relative; z-index: 1; }
    .sub { color: #64748b; font-size: 0.9rem; letter-spacing: 1px; margin-bottom: 16px; }
    .divider { width: 80px; height: 2px; background: linear-gradient(90deg, transparent, #d4a843, transparent); margin: 0 auto 24px; }
    .name { font-size: 2rem; color: #4422CA; font-weight: 700; font-family: 'Georgia', serif; margin-bottom: 8px; display: inline-block; padding-bottom: 4px; border-bottom: 2px solid #22B9CA; }
    .course { font-size: 1.3rem; color: #1e1b4b; font-weight: 700; margin: 18px 0 20px; display: inline-block; padding: 4px 18px; background: rgba(68,34,202,0.05); border-radius: 30px; }
    .date { color: #64748b; font-size: 0.85rem; }
    .footer { margin-top: 35px; color: #94a3b8; font-size: 0.7rem; }
</style></head>
<body>
    <div class="cert">
        <div class="badge">🏆</div>
        <h1>Сертификат</h1>
        <p class="sub">подтверждает, что</p>
        <div class="divider"></div>
        <div class="name">${studentName}</div>
        <p class="sub">успешно завершил(а) курс</p>
        <div class="course">«${course.name}»</div>
        <p class="date">📅 Дата выдачи: ${completionDate}</p>
        <div class="footer">Платформа NextStep Education • ${completionDate}</div>
    </div>
</body>
</html>`;
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Сертификат_${course.name.replace(/\s/g, '_')}.html`;
        a.click();
        URL.revokeObjectURL(url);
    }

    function shareCertificate(course, studentName) {
        const text = `🏆 Я завершил курс «${course.name}» на платформе NextStep! Студент: ${studentName}`;
        if (navigator.share) {
            navigator.share({ title: 'Мой сертификат NextStep', text: text, url: window.location.href }).catch(() => {});
        } else {
            navigator.clipboard.writeText(text).then(() => alert('✅ Текст для публикации скопирован в буфер обмена!'));
        }
    }

    function renderPage() {
        const main = document.getElementById('mainContent');
        const user = getCurrentUser();
        const studentName = user.fullName || user.email || 'Студент NextStep';
        
        const completedCourses = allCourses.filter(c => isCourseCompleted(c.storageKey));
        const lockedCourses = allCourses.filter(c => !isCourseCompleted(c.storageKey));
        
        let html = `
            <div class="page-header">
                <h1>🏅 Сертификаты</h1>
                <p class="subtitle">Ваши достижения и подтверждённые квалификации на платформе NextStep</p>
            </div>
            
            <div class="about-certificates">
                <div class="about-icon">🎓</div>
                <div class="about-text">
                    <h3>Почему важны сертификаты?</h3>
                    <p>Сертификаты NextStep — это официальное подтверждение ваших знаний и навыков. Они помогают при трудоустройстве, поступлении на стажировки и формировании профессионального портфолио. Каждый сертификат содержит уникальные данные для проверки подлинности.</p>
                    <div class="about-highlights">
                        <div class="about-highlight-item">✅ Подтверждение навыков</div>
                        <div class="about-highlight-item">📄 HTML-версия для печати</div>
                        <div class="about-highlight-item">🔗 Делитесь в соцсетях</div>
                        <div class="about-highlight-item">🏢 Ценится работодателями</div>
                    </div>
                </div>
            </div>
        `;
        
        if (completedCourses.length === 0 && lockedCourses.length === 0) {
            html += `
                <div class="empty-state">
                    <div class="empty-icon">📭</div>
                    <h2>Нет доступных курсов</h2>
                    <p>На платформе пока нет курсов, для которых можно получить сертификат. Загляните в каталог!</p>
                    <a href="каталог некст.html" class="cert-btn primary" style="text-decoration:none;">📚 Перейти в каталог</a>
                </div>
            `;
        } else {
            html += `<div class="certificates-grid">`;
            
            completedCourses.forEach(course => {
                const completionDate = getCompletionDate(course.storageKey);
                const safeStudentName = studentName.replace(/'/g, "\\'");
                
                html += `
                    <div class="certificate-item">
                        <div class="course-label">${course.icon} ${course.name} <span style="background:#d1fae5;color:#065f46;padding:2px 10px;border-radius:20px;font-size:0.7rem;">✓ Завершён</span></div>
                        <div class="certificate-wrapper">
                            <div class="certificate-document">
                                <div class="cert-ribbon-left"></div>
                                <div class="cert-ribbon-right"></div>
                                <div class="cert-badge">🏆</div>
                                <div class="cert-heading">Сертификат</div>
                                <div class="cert-subheading">подтверждает, что</div>
                                <div class="cert-divider"></div>
                                <div class="cert-presented">настоящий сертификат вручается</div>
                                <div class="cert-student-name">${studentName}</div>
                                <div class="cert-for">за успешное завершение курса</div>
                                <div class="cert-course-name">«${course.name}»</div>
                                <div class="cert-date">📅 Дата выдачи: ${completionDate}</div>
                                <div class="cert-signatures">
                                    <div class="cert-signature-item">
                                        <div class="cert-signature-line"></div>
                                        <div class="cert-signature-name">${course.teacherName}</div>
                                        <div class="cert-signature-role">Преподаватель курса</div>
                                    </div>
                                    <div class="cert-signature-item">
                                        <div class="cert-signature-line"></div>
                                        <div class="cert-signature-name">NextStep</div>
                                        <div class="cert-signature-role">Образовательная платформа</div>
                                    </div>
                                </div>
                                <div class="cert-seal">NextStep<br>Verified</div>
                            </div>
                        </div>
                        <div class="cert-actions-row">
                            <button class="cert-btn primary" onclick="downloadCertificateHTML(allCourses.find(c=>c.id==='${course.id}'), '${safeStudentName}', '${completionDate}')">📥 Скачать сертификат</button>
                            <button class="cert-btn secondary" onclick="shareCertificate(allCourses.find(c=>c.id==='${course.id}'), '${safeStudentName}')">📤 Поделиться</button>
                            <button class="cert-btn outline" onclick="window.print()">🖨️ Распечатать</button>
                        </div>
                    </div>
                `;
            });
            
            lockedCourses.forEach(course => {
                html += `
                    <div class="certificate-item">
                        <div class="course-label">${course.icon} ${course.name} <span style="background:#f1f5f9;color:#64748b;padding:2px 10px;border-radius:20px;font-size:0.7rem;">🔒 Не завершён</span></div>
                        <div class="locked-certificate">
                            <div class="lock-icon">🔒</div>
                            <h3>Сертификат пока недоступен</h3>
                            <p>Завершите все блоки курса «${course.name}», чтобы получить сертификат.</p>
                            <a href="${course.coursePage}" class="btn-back">← Перейти к курсу</a>
                        </div>
                    </div>
                `;
            });
            
            html += `</div>`;
        }
        
        main.innerHTML = html;
    }

    window.downloadCertificateHTML = downloadCertificateHTML;
    window.shareCertificate = shareCertificate;
    window.allCourses = allCourses;

            updateProjectsMenuItem();
        renderPage();
        
        // КНОПКА ЧАТА
        document.getElementById('chatTopBtn')?.addEventListener('click', function() {
            window.location.href = 'сообщения.html';
        });
</script>
</body>
</html>
