</div>
<div class="main-content">
    <div class="course-header">
        <div class="title-section"><h1>🔐 Безопасность IT</h1><p>Кибербезопасность • Шифрование • Этичный хакинг • 7 недель</p></div>
        <div class="progress-overview"><div class="progress-stats">
            <div class="stat-item"><div class="stat-number" id="totalProgress">0</div><div class="stat-label">% курса</div></div>
            <div class="stat-item"><div class="stat-number" id="passedBlocks">0</div><div class="stat-label">блоков</div></div>

        <div class="certificate-icon">🏆</div>
        <div class="certificate-title">Поздравляем с завершением курса!</div>
        <div class="certificate-description">Все блоки пройдены. Получите сертификат «Безопасность IT».</div>
        <button class="certificate-btn" onclick="window.location.href='сертификаты.html'">📜 Просмотреть сертификат</button>
    </div>
    <a href="мои курсы некст.html" class="back-to-courses">Вернуться в мои курсы</a>

<div id="lectureModal" class="modal"><div class="modal-content"><div class="modal-header"><h3 id="modalTitle">📄 Конспект</h3><button class="close-modal" onclick="closeModal()">&times;</button></div><div class="modal-body" id="modalBody"></div></div></div>

<script>
    const lectureTexts = {
        lecture1: "КОНСПЕКТ 1: Основы кибербезопасности\n\nКибербезопасность — защита систем, сетей и данных от цифровых атак.\n\nТриада CIA:\n• Confidentiality — конфиденциальность\n• Integrity — целостность\n• Availability — доступность\n\nОсновные угрозы:\n• Malware (вирусы, трояны, ransomware)\n• Phishing — фишинговые атаки\n• DDoS — отказ в обслуживании\n• SQL Injection\n• XSS — межсайтовый скриптинг\n\nПринципы защиты:\n• Defence in Depth — эшелонированная оборона\n• Least Privilege — минимальные привилегии\n• Zero Trust — не доверяй никому",
        lecture2: "КОНСПЕКТ 2: Криптография\n\nШифрование — преобразование данных для защиты.\n\nСимметричное (один ключ): AES\nАсимметричное (пара ключей): RSA, ECC\n\nХеширование: SHA-256, bcrypt — необратимо.\nПротоколы: HTTPS = HTTP + TLS",
        lecture3: "КОНСПЕКТ 3: Сетевые атаки\n\nDDoS — атака отказа в обслуживании.\nВиды: Volumetric, Protocol, Application.\nЗащита: CDN, Rate limiting, WAF.\nMITM — перехват трафика. Защита: HTTPS, VPN.",
        lecture4: "КОНСПЕКТ 4: Веб-уязвимости\n\nOWASP Top 10 — главные угрозы веб-приложений.\nSQL Injection: ' OR '1'='1' --\nЗащита: parameterized queries\nXSS — внедрение скриптов. Защита: escaping, CSP",
        lecture5: "КОНСПЕКТ 5: Этичный хакинг\n\nPenetration Testing — тестирование на проникновение.\nЭтапы: Reconnaissance, Scanning, Exploitation.\nИнструменты: Nmap, Burp Suite, Metasploit.",
        lecture6: "КОНСПЕКТ 6: Анализ логов\n\nТипы логов: Access, Error, Auth, System.\nПоиск аномалий: подозрительные IP, brute-force.\nSIEM: Splunk, ELK Stack.",
        lecture7: "КОНСПЕКТ 7: Безопасность паролей\n\nПравила: минимум 12 символов, уникальный пароль.\nМенеджеры паролей: Bitwarden.\n2FA: TOTP, SMS, биометрия.",
        lecture8: "КОНСПЕКТ 8: Построение защиты\n\nSDL: Threat Modeling, Secure Coding.\nIncident Response: Preparation, Identification, Containment."
    };

    function getLectureContent(bi, li) { 
        var nums = [1, 4, 7];
        return lectureTexts['lecture' + (nums[bi] + li)] || 'Содержание появится позже...';
    }
    function showModal(t, c) {
        document.getElementById('modalTitle').innerText = t;
        document.getElementById('modalBody').innerHTML = c.replace(/\n/g, '<br>');
        document.getElementById('lectureModal').style.display = 'flex';
    }
    window.closeModal = function() { document.getElementById('lectureModal').style.display = 'none'; };
    window.onclick = function(e) { if (e.target === document.getElementById('lectureModal')) closeModal(); };

    var investigations = [
        {
            scenario: "Бухгалтер компании «TechCorp» получила письмо от «директора» с просьбой срочно перевести 500 000 рублей. Перевод сделан. Это мошенники.",
            evidence: [
                { id: "email", icon: "📧", name: "Фишинговое письмо", desc: "Адрес: director@techcorp-secure.com (настоящий: director@techcorp.com)" },
                { id: "ip", icon: "🌐", name: "IP-адрес", desc: "185.220.101.xxx — выходной узел Tor" },
                { id: "log", icon: "📋", name: "Логи сервера", desc: "SPF: FAIL. DKIM: не подписан." },
                { id: "domain", icon: "🔗", name: "WHOIS домена", desc: "Зарегистрирован 3 дня назад анонимно." }
            ],
            logLines: "09:23:45 MAIL FROM: attacker@mail.ru\n09:23:46 SPF check: FAIL\n09:23:48 IP: 185.220.101.xx\n09:35:00 Transaction: 500 000 RUB",
            suspects: [
                { id: "hacker", name: "Внешний хакер", role: "Неизвестный", avatar: "🦹" },
                { id: "insider", name: "Сисадмин Иван", role: "IT-отдел", avatar: "👨‍💻" },
                { id: "competitor", name: "Конкурент", role: "ООО «Техно»", avatar: "🏢" }
            ],
            correctEvidence: ["email", "ip", "log", "domain"],
            correctSuspect: "hacker",
            explanation: "Это BEC-атака. Злоумышленник зарегистрировал похожий домен и отправил письмо через Tor. SPF и DKIM не прошли.",

    function loadProgress() {
    // ========== ПРОВЕРКА АВТОРИЗАЦИИ (с повторной проверкой) ==========
    let currentUser = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
    
    function doRedirect() {
        window.location.href = 'вход некст.html';
    }
    
    if (!currentUser.email || currentUser.role !== 'student') {
        setTimeout(() => {
            let user2 = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
            if (!user2.email || user2.role !== 'student') {
                doRedirect();
            }
        }, 20);
        return;
    }
    // ========== КОНЕЦ ПРОВЕРКИ ==========
    
    const saved = localStorage.getItem('courseSecurity_v3');
    if(!saved) return;
    try {
        const data = JSON.parse(saved);
        for(let i=0; i<blocks.length && i<data.length; i++) {
            if(data[i]) {
                blocks[i].completed = data[i].completed || false;
                blocks[i].unlocked = data[i].unlocked || (i===0);
                if(data[i].tests) {
                    for(let t=0; t<blocks[i].tests.length; t++) {
                        if(data[i].tests[t]) {
                            blocks[i].tests[t].userAnswer = data[i].tests[t].userAnswer;
                            blocks[i].tests[t].answered = data[i].tests[t].answered;
                        }
                    }
                }
                if(data[i].assignments) {
                    for(let a=0; a<blocks[i].assignments.length; a++) {
                        if(data[i].assignments[a]) {
                            blocks[i].assignments[a].submitted = data[i].assignments[a].submitted || false;
                            blocks[i].assignments[a].reviewed = data[i].assignments[a].reviewed || false;
                            blocks[i].assignments[a].feedback = data[i].assignments[a].feedback || '';
                            blocks[i].assignments[a].grade = data[i].assignments[a].grade || null;
                        }
                    }
                }
                if(data[i].videos) {
                    for(let v=0; v<blocks[i].videos.length; v++) {
                        if(data[i].videos[v]) blocks[i].videos[v].watched = data[i].videos[v].watched || false;
                    }
                }
                if(data[i].lectures) {
                    for(let l=0; l<blocks[i].lectures.length; l++) {
                        if(data[i].lectures[l]) blocks[i].lectures[l].downloaded = data[i].lectures[l].downloaded || false;
                    }
                }
            }
        }
        for(let i=1; i<blocks.length; i++) {
            if(blocks[i-1].completed && !blocks[i].unlocked) blocks[i].unlocked = true;
        }
    } catch(e) { console.warn(e); }
    updateStats();
    loadSubmissionStatuses();
    checkAllBlocksCompleted();
}
    function loadSubmissionStatuses() {
        var subs = JSON.parse(localStorage.getItem('nextstep_submissions') || '[]');
        var user = JSON.parse(localStorage.getItem('nextstep_current_user') || '{}');
        blocks.forEach(function(b) {
            var sub = subs.find(function(s) {
                return s.userEmail === user.email && s.assignmentTitle === 'Кибер-расследование: ' + b.name && s.courseName === "Безопасность IT";
            });
            if (sub) {
                if (sub.reviewed) { b.invReviewed = true; b.invSubmitted = true; }
                else if (sub.submitted) { b.invSubmitted = true; b.invReviewed = false; }
            }
        });
        saveProgress();
    }

    function updateStats() {
        var completed = blocks.filter(function(b) { return b.completed; }).length;
        document.getElementById('totalProgress').innerText = Math.round((completed / blocks.length) * 100);
        document.getElementById('passedBlocks').innerText = completed + '/' + blocks.length;
        var score = 0, cnt = 0;
        blocks.forEach(function(b) {
            b.tests.forEach(function(t) {
                if (t.answered) { cnt++; if (t.userAnswer === t.correct) score++; }
            });
        });
        document.getElementById('quizAvg').innerText = cnt ? Math.round((score / cnt) * 100) : 0;
    }

    function checkBlockCompletion(idx) {
        var b = blocks[idx];
        var ok = b.videos.every(function(v) { return v.watched; }) &&
                 b.lectures.every(function(l) { return l.downloaded; }) &&
                 b.tests.every(function(t) { return t.answered && t.userAnswer === t.correct; }) &&
                 b.invReviewed;
        if (ok && !b.completed) {
            b.completed = true;
            if (idx + 1 < blocks.length) blocks[idx + 1].unlocked = true;
            saveProgress(); updateStats(); renderBlocksNav();
            if (currentBlock === idx) renderCurrentBlock();
        }
        saveProgress(); updateStats();
    }

    function renderBlocksNav() {

            if (b.completed) cls += ' completed';
            else if (!b.unlocked && i) cls += ' locked';
            html += '<button class="' + cls + '" data-idx="' + i + '" ' + (!b.unlocked && i ? 'disabled' : '') + '>' + b.name + ' ' + (b.completed ? '✓' : '') + '</button>';
        });
        document.getElementById('blocksNav').innerHTML = html;
        document.querySelectorAll('.block-tab:not([disabled])').forEach(function(btn) {
            btn.onclick = function() {

                renderBlocksNav();

    window.accuseSuspect = function(id) {
        if (invState.solved) return;
        invState.accused = id;
        var inv = blocks[currentBlock].investigation;
        var allDone = inv.correctEvidence.every(function(e) { return invState.collected.indexOf(e) !== -1; });
        if (!allDone) {
            var res = document.getElementById('invResult');
            res.classList.add('show');
            res.style.background = '#fef3c7';
            res.style.color = '#92400e';
            res.innerHTML = '⚠️ Сначала соберите все улики!';
            return;
        }
        invState.solved = true;
        var correct = id === inv.correctSuspect;
        var res = document.getElementById('invResult');
        res.classList.add('show');
        if (correct) {
            res.style.background = '#d1fae5';
            res.style.color = '#065f46';
            res.innerHTML = '🎉 Верно! Это <strong>' + inv.attackType + '</strong>.<br><br>' + inv.explanation;

            document.querySelector('.inv-badge').textContent = '✅ РАСКРЫТО';

    function updateInvUI() {

        var inv = blocks[currentBlock].investigation;

        if (logEl) logEl.classList.toggle('show', allDone);
        document.querySelectorAll('.suspect-card').forEach(function(c) {
            c.classList.remove('accused', 'innocent');

                if (invState.solved) {
                    c.classList.add(c.dataset.suspectId === inv.correctSuspect ? 'innocent' : 'accused');

    function attachTestHandlers() {

                o.onclick = function() {
                    q.userAnswer = parseInt(this.dataset.opt);

                    card.querySelectorAll('.quiz-option').forEach(function(x) { x.classList.remove('selected'); });
                    this.classList.add('selected');
                };
            });
            card.querySelector('.quiz-submit').onclick = function() {
                if (q.userAnswer === null || q.userAnswer === undefined) return alert('Выберите ответ');
                q.answered = true;
                var fb = document.getElementById('fb-' + qi);
                fb.style.display = 'block';
                if (q.userAnswer === q.correct) {
                    fb.innerHTML = '✅ Верно!';
                    fb.style.background = '#d1fae5';
                } else {
                    fb.innerHTML = '❌ Правильно: ' + q.options[q.correct];
                    fb.style.background = '#fee2e2';
                }
                saveProgress();
                checkBlockCompletion(currentBlock);
                renderCurrentBlock();
            };
            card.querySelector('.quiz-cancel').onclick = function() {
                q.userAnswer = null;
                q.answered = false;
                saveProgress();
                renderCurrentBlock();
            };

            if (q.userAnswer !== null && q.userAnswer !== undefined) {
                var opt = card.querySelector('.quiz-option[data-opt="' + q.userAnswer + '"]');
                if (opt) opt.classList.add('selected');
                if (q.answered) {

                        fb.style.background = '#fee2e2';
                    }
                }
            }
        });

            invHtml += '<div class="suspect-card" data-suspect-id="' + s.id + '" onclick="accuseSuspect(\'' + s.id + '\')"><div class="suspect-avatar">' + s.avatar + '</div><div class="suspect-name">' + s.name + '</div><div class="suspect-role">' + s.role + '</div></div>';
        });
        invHtml += '</div><div class="investigation-buttons"><button class="inv-btn secondary" onclick="resetInvestigation()">↺ Начать заново</button><button class="inv-btn primary" id="invSubmitBtn" disabled onclick="submitInvestigation()">📨 Отправить отчёт</button>';
        if (b.invReviewed) invHtml += '<span style="color:#059669;font-weight:600;">✅ Проверено</span>';
        else if (b.invSubmitted) invHtml += '<span style="color:#d97706;font-weight:600;">⏳ На проверке</span>';
        invHtml += '</div><div class="inv-result" id="invResult"></div></div>';

        var canComplete = b.videos.every(function(v) { return v.watched; }) &&
                         b.lectures.every(function(l) { return l.downloaded; }) &&
                         b.tests.every(function(t) { return t.answered && t.userAnswer === t.correct; }) &&
                         b.invReviewed;

        c.innerHTML = '<div class="block-container"><div class="block-title">' + b.name + '</div><div class="block-subtitle">✅ Видео | ✅ Конспекты | ✅ Тесты | ✅ Кибер-расследование</div>' +
            (vidsHtml ? '<h3>🎥 Видеоуроки</h3>' + vidsHtml : '') +
            (lecsHtml ? '<h3>📚 Конспекты</h3>' + lecsHtml : '') +
            '<h3>📝 Тесты</h3>' + testsHtml + invHtml +
            '<button class="complete-block-btn" id="completeBtn" ' + (b.completed || !canComplete ? 'disabled' : '') + '>' + (b.completed ? '✅ Блок пройден' : '🎉 Завершить блок') + '</button></div>';

        // Назначаем обработчики
        c.querySelectorAll('.video-card').forEach(function(card) {
            card.onclick = function() {
                var i = parseInt(this.dataset.vidx);
                window.open(b.videos[i].url, '_blank');
                if (!b.videos[i].watched) { b.videos[i].watched = true; checkBlockCompletion(currentBlock); renderCurrentBlock(); }
            };
        });
        c.querySelectorAll('.lecture-item').forEach(function(lec) {
            lec.onclick = function() {
                var i = parseInt(this.dataset.lidx);
                showModal(b.lectures[i].title, getLectureContent(currentBlock, i));
                if (!b.lectures[i].downloaded) { b.lectures[i].downloaded = true; checkBlockCompletion(currentBlock); renderCurrentBlock(); }
            };
        });

        // ВАЖНО: назначаем обработчики тестов через отдельную функцию
        attachTestHandlers();

        var completeBtn = document.getElementById('completeBtn');
        if (completeBtn) {
            completeBtn.onclick = function() {
                if (canComplete) {
                    b.completed = true;
                    if (currentBlock + 1 < blocks.length) blocks[currentBlock + 1].unlocked = true;
                    saveProgress();
                    updateStats();
                    renderBlocksNav();
                    renderCurrentBlock();
                    alert('🎉 Блок "' + b.name + '" пройден!');
                }
            };
        }
        updateStats();
    }

    loadProgress();
    renderBlocksNav();
    renderCurrentBlock();
</script>
</body>
</html>
